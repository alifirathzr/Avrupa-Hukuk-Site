    <script>

        document.addEventListener('DOMContentLoaded', async () => {

            const catContainer = document.getElementById('categories-container');

            try {
                const res = await fetch('/api/categories');
                const categories = await res.json();
                if (Array.isArray(categories)) {
                    const iconMap = {
                        "Ceza Hukuku": "fa-gavel",
                        "Tazminat Hukuku": "fa-scale-balanced",
                        "Gayrimenkul Hukuku": "fa-house-chimney",
                        "Medeni Hukuku": "fa-users",
                        "Medeni Hukuk": "fa-users",
                        "Borçlar Hukuku": "fa-file-contract",
                        "İdare ve Vergi Hukuku": "fa-building-columns",
                        "AİHM ve Anayasa Mahkemesi'ne Bireysel Başvuru": "fa-landmark",
                        "Arabuluculuk": "fa-handshake",
                        "Mevzuat": "fa-book",
                        "Mevzuat ve Yargıtay Kararları": "fa-book"
                    };

                    catContainer.innerHTML = categories.map(cat => {
                        const icon = iconMap[cat.name] || "fa-scale-balanced";
                        const desc = cat.description || "Hukuki analizler ve güncel makaleler.";
                        
                        let iconHtml = `<i class="fa-solid ${icon}"></i>`;
                        if (cat.image_url && (cat.image_url.startsWith('http://') || cat.image_url.startsWith('https://') || cat.image_url.startsWith('data:'))) {
                            iconHtml = `<img src="${cat.image_url}" alt="" style="width: 56px; height: 56px; object-fit: contain; border-radius: 12px; background: transparent; box-shadow: 0 4px 12px rgba(197, 160, 89, 0.2); border: 2px solid #c5a059;" onerror="this.onerror=null; this.parentElement.innerHTML='<i class=\'fa-solid ${icon}\'></i>';" />`;
                        }

                        return `
                            <a href="makaleler-liste.html?kategori=${encodeURIComponent(cat.name)}" class="card category-card">
                                <div class="card-icon">${iconHtml}</div>
                                <h3>${cat.name}</h3>
                                <p>${desc}</p>
                            </a>
                        `;
                    }).join('');
                }
            } catch (e) {
                console.error("Kategoriler yüklenemedi:", e);
            }

        });

    </script>
