<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Admin Paneli | Av. Barış Hezer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0d1b2a;
            --secondary: #1b263b;
            --accent: #c5a059;
            --accent-hover: #b38f4d;
            --bg-light: #f4f7f6;
            --text-dark: #333333;
            --white: #ffffff;
            --danger: #ef4444;
            --border: #cbd5e1;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        body { background: var(--bg-light); color: var(--text-dark); font-family: 'Inter', sans-serif; padding: 2.5rem 1rem; margin: 0; line-height: 1.6; }
        .dashboard { max-width: 1200px; margin: auto; }
        h1 { color: var(--primary); text-align: center; margin-bottom: 2.5rem; font-family: 'Cinzel', serif; font-weight: 700; letter-spacing: 1px; }
        .card { background: var(--white); padding: 2.5rem; margin-bottom: 2rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); border: 1px solid #e2e8f0; }
        .card h2 { color: var(--primary); font-family: 'Cinzel', serif; font-size: 1.35rem; margin-bottom: 1.5rem; border-bottom: 2px solid var(--accent); padding-bottom: 0.75rem; display: flex; align-items: center; gap: 0.5rem; }
        
        /* General Form */
        form { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
        
        /* Specific Article Form Layout (Clean & Organized) */
        #articleForm {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
            align-items: center;
        }
        #articleForm select {
            grid-column: 1 / 2;
        }
        #articleForm .featured-label {
            grid-column: 2 / 3;
            background: #f8f9fa;
            padding: 0.75rem 1rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            height: 100%;
            display: flex;
            align-items: center;
            cursor: pointer;
        }
        #articleForm input#articleImage {
            grid-column: 1 / -1;
        }
        #articleForm input#aTitle {
            grid-column: 1 / -1;
        }
        #articleForm textarea#aSummary {
            grid-column: 1 / -1;
        }
        #articleForm textarea#aContent {
            grid-column: 1 / -1;
        }
        #articleForm button[type="submit"] {
            grid-column: 1 / -1;
            background: var(--primary);
            color: var(--white);
            padding: 1rem;
            font-size: 1rem;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
            box-shadow: 0 4px 12px rgba(13,27,42,0.15);
        }
        #articleForm button[type="submit"]:hover {
            background: var(--accent);
            color: var(--primary);
        }

        /* Other forms layout */
        #catForm, #faqForm {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)) auto;
            gap: 1rem;
            align-items: center;
        }
        #catForm button, #faqForm button {
            height: 100%;
        }

        input, textarea, select { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; font-family: 'Inter', sans-serif; font-size: 0.95rem; background: var(--white); transition: border-color 0.2s, box-shadow 0.2s; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(197, 160, 89, 0.15); }
        
        button { background: var(--primary); border: none; padding: 12px 20px; color: var(--white); cursor: pointer; border-radius: 6px; font-weight: 600; transition: var(--transition); }
        button:hover { background: var(--accent); }
        
        table { width: 100%; border-collapse: collapse; margin-top: 1.5rem; }
        th { text-align: left; padding: 12px 14px; background: #f8f9fa; border-bottom: 2px solid #e2e8f0; color: var(--primary); font-weight: 600; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.5px; }
        td { padding: 14px; border-bottom: 1px solid #e2e8f0; font-size: 0.95rem; }
        tr:hover td { background: #fafbfc; }
        
        .btn-del { background: var(--danger); color: white; padding: 6px 14px; border-radius: 4px; border: none; cursor: pointer; font-size: 0.85rem; transition: opacity 0.2s; }
        .btn-del:hover { opacity: 0.85; }
        .featured-label { display: flex; align-items: center; gap: 10px; font-weight: 500; font-size: 0.95rem; color: var(--primary); cursor: pointer; }
        .featured-label input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
        
        .action-btns { display: flex; gap: 8px; align-items: center; }
        .btn-feature { background: var(--accent); color: var(--primary); padding: 6px 12px; border-radius: 4px; border: none; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: var(--transition); }
        .btn-feature:hover { background: var(--accent-hover); }

        @media (max-width: 768px) {
            #articleForm { grid-template-columns: 1fr; }
            #articleForm select, #articleForm .featured-label { grid-column: 1 / -1; }
            #catForm, #faqForm { grid-template-columns: 1fr; }
        }

        /* Custom Modal Styles */
        .custom-modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            animation: fadeIn 0.2s ease;
        }
        .custom-modal {
            background: var(--white);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            max-width: 400px;
            width: 90%;
            text-align: center;
        }
        .custom-modal h3 {
            color: var(--primary);
            font-family: 'Cinzel', serif;
            margin-top: 0;
            margin-bottom: 1rem;
        }
        .custom-modal p {
            color: var(--text-dark);
            margin-bottom: 1.5rem;
        }
        .custom-modal-btns {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }
        .custom-modal-btns button {
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: var(--transition);
        }
        #customConfirmYes {
            background: var(--danger);
            color: white;
        }
        #customConfirmYes:hover {
            opacity: 0.9;
        }
        #customConfirmNo {
            background: #e2e8f0;
            color: var(--text-dark);
        }
        #customConfirmNo:hover {
            background: #cbd5e1;
        }

        /* Toast Notification Styles */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast {
            background: var(--primary);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideIn 0.3s ease;
            max-width: 350px;
        }
        .toast.error {
            background: var(--danger);
        }
        .toast.success {
            background: #10b981;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <!-- Toast Notification Container -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Custom Confirm Modal -->
    <div id="customConfirmModal" class="custom-modal-overlay" style="display:none;">
        <div class="custom-modal">
            <h3>Silme Onayı</h3>
            <p id="customConfirmText">Bu içeriği silmek istediğinize emin misiniz?</p>
            <div class="custom-modal-btns">
                <button id="customConfirmYes">Evet, Sil</button>
                <button id="customConfirmNo">İptal</button>
            </div>
        </div>
    </div>
    <div class="dashboard">
        <h1>Admin Dashboard</h1>
        <div class="card">
            <h2>Mesajlar</h2>
            <table class="admin-table">
                <thead><tr><th>Tarih</th><th>Ad</th><th>E-posta</th><th>Konu</th><th>İşlem</th></tr></thead>
                <tbody id="messageBody"></tbody>
            </table>
        </div>
        <div class="card">
            <h2>Kategori Yönetimi</h2>
            <form id="catForm">
                <input type="text" id="cName" placeholder="Kategori Adı" required>
                <input type="text" id="cDesc" placeholder="Açıklama">
                <input type="text" id="cImg" placeholder="Görsel URL">
                <button type="submit">Kategori Ekle</button>
            </form>
            <table class="admin-table">
                <thead><tr><th>Ad</th><th>İşlem</th></tr></thead>
                <tbody id="catBody"></tbody>
            </table>
        </div>
        <div class="card">
            <h2>Makale Yönetimi</h2>
            <form id="articleForm">
                <select id="articleCategory" required>
                    <option value="" disabled selected>Kategori Seçiniz</option>
                    <option>Ceza Hukuku</option>
                    <option>Tazminat Hukuku</option>
                    <option>Gayrimenkul Hukuku</option>
                    <option>Medeni Hukuku</option>
                    <option>Borçlar Hukuku</option>
                    <option>İdare ve Vergi Hukuku</option>
                    <option>AİHM ve Anayasa Mahkemesi'ne Bireysel Başvuru</option>
                    <option>Arabuluculuk</option>
                    <option>Mevzuat ve Yargıtay Kararları</option>
                </select>
                <label class="featured-label"><input type="checkbox" id="aFeatured"> Anasayfada Göster</label>
                <input type="text" id="articleImage" placeholder="Görsel URL (Boş bırakılırsa kategori varsayılanı kullanılır)">
                <input type="text" id="aTitle" placeholder="Başlık" required>
                <textarea id="aSummary" placeholder="Özet" rows="3" required></textarea>
                <textarea id="aContent" placeholder="İçerik" rows="5" required></textarea>
                <button type="submit">Makale Ekle</button>
            </form>
    <script>
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'slideIn 0.3s ease reverse';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function showConfirmModal(message = 'Bu içeriği silmek istediğinize emin misiniz?') {
            return new Promise((resolve) => {
                const modal = document.getElementById('customConfirmModal');
                const textElem = document.getElementById('customConfirmText');
                const yesBtn = document.getElementById('customConfirmYes');
                const noBtn = document.getElementById('customConfirmNo');

                textElem.textContent = message;
                modal.style.display = 'flex';

                function cleanup() {
                    modal.style.display = 'none';
                    yesBtn.removeEventListener('click', onYes);
                    noBtn.removeEventListener('click', onNo);
                }

                function onYes() {
                    cleanup();
                    resolve(true);
                }

                function onNo() {
                    cleanup();
                    resolve(false);
                }

                yesBtn.addEventListener('click', onYes);
                noBtn.addEventListener('click', onNo);
            });
        }

        window.deleteGeneral = async function(type, id) {
            const confirmed = await showConfirmModal('Bu içeriği silmek istediğinize emin misiniz?');
            if (!confirmed) return;
            try {
                const res = await fetch(`/api/${type}/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    showToast('İçerik başarıyla silindi.');
                    if (type === 'faqs') loadFAQs();
                    else if (type === 'admin/messages') loadMessages();
                    else if (type === 'categories') loadCategories();
                    else loadData();
                } else {
                    showToast('Silme işlemi başarısız oldu.', 'error');
                }
            } catch (err) {
                console.error('Silme hatası:', err);
                showToast('Silme sırasında hata oluştu.', 'error');
            }
        };

        window.deleteArticle = window.deleteGeneral;
        window.deleteItem = window.deleteGeneral;
        window.del = window.deleteGeneral;
    </script>
            <table class="admin-table">
                <thead><tr><th>Başlık</th><th>Kategori</th><th>İşlem</th></tr></thead>
                <tbody id="articleBody"></tbody>
            </table>
        </div>
        <div class="card">
            <h2>SSS Yönetimi</h2>
            <form id="faqForm">
                <input type="text" id="fQuestion" placeholder="Soru" required>
                <input type="text" id="fAnswer" placeholder="Cevap" required>
                <button type="submit">SSS Ekle</button>
            </form>
            <table class="admin-table">
                <thead><tr><th>Soru</th><th>İşlem</th></tr></thead>
                <tbody id="faqBody"></tbody>
            </table>
        </div>
    </div>
    <script>
        function loadData() {
            fetch('/api/articles').then(res => res.json()).then(data => {
                const body = document.getElementById('articleBody');
                body.innerHTML = data.map(a => `
                    <tr>
                        <td>${a.title}</td>
                        <td>${a.category}</td>
                        <td>
                            <div class="action-btns">
                                <button class="btn-feature" onclick="toggleFeature(${a.id}, ${a.is_featured})">${a.is_featured ? 'Çıkar' : 'Ekle'}</button>
                                <button class="btn-del" onclick="del('articles', ${a.id})">Sil</button>
                            </div>
                        </td>
                    </tr>`).join('');
            });
            loadMessages();
            loadCategories();
            loadFAQs();
        }
        async function loadMessages() {
            try {
                const res = await fetch('/api/admin/messages');
                if (!res.ok) return;
                const data = await res.json();
                const body = document.getElementById('messageBody');
                body.innerHTML = data.map(m => `<tr><td>${new Date(m.date).toLocaleDateString()}</td><td>${m.name}</td><td>${m.email}</td><td>${m.subject}</td><td><button class="btn-del" onclick="deleteItem('admin/messages', ${m.id})">Sil</button></td></tr>`).join('');
            } catch (e) {
                console.error("Mesajlar yüklenemedi:", e);
            }
        }
        async function loadCategories() {
            try {
                const res = await fetch('/api/categories');
                if (!res.ok) return;
                const data = await res.json();
                const body = document.getElementById('catBody');
                body.innerHTML = data.map(c => `<tr><td>${c.name}</td><td><button class="btn-del" onclick="deleteCategory(${c.id})">Sil</button></td></tr>`).join('');
                
                // Makale ekleme kısmındaki kategori seçme yeri ile kategori kısmını bağla
                const articleCatSelect = document.getElementById('articleCategory');
                if (articleCatSelect) {
                    const currentVal = articleCatSelect.value;
                    articleCatSelect.innerHTML = '<option value="" disabled selected>Kategori Seçiniz</option>' +
                        data.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
                    if (currentVal) articleCatSelect.value = currentVal;
                }
            } catch (e) {
                console.error("Kategoriler yüklenemedi:", e);
            }
        }
        async function deleteCategory(id) {
            const confirmed = await showConfirmModal('Bu kategoriyi silmek istediğinize emin misiniz?');
            if (!confirmed) return;
            try {
                const res = await fetch('/api/categories/' + id, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' }
                });
                if (res.ok) {
                    showToast('Kategori başarıyla silindi.');
                    loadCategories();
                } else {
                    const errData = await res.json().catch(() => ({}));
                    showToast('Silme başarısız: ' + (errData.error || res.statusText), 'error');
                }
            } catch (err) {
                console.error('Kategori silme hatası:', err);
                showToast('Silme sırasında hata oluştu.', 'error');
            }
        }

        async function deleteItem(endpoint, id) {
            if (endpoint === 'categories') {
                return deleteCategory(id);
            }
            return deleteGeneral(endpoint, id);
        }

        // Global scope bağlantıları
        window.deleteCategory = deleteCategory;
        window.deleteItem = deleteItem;

        document.getElementById('catForm').onsubmit = (e) => {
            e.preventDefault();
            fetch('/api/categories', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({
                name: document.getElementById('cName').value,
                description: document.getElementById('cDesc').value,
                image_url: document.getElementById('cImg').value
            }) }).then(res => {
                if (res.ok) {
                    document.getElementById('catForm').reset();
                    loadCategories();
                    showToast('Kategori başarıyla eklendi!');
                } else {
                    showToast('Kategori eklenemedi.', 'error');
                }
            });
        };

        function loadFAQs() {
            fetch('/api/faqs').then(res => res.json()).then(data => {
                const body = document.getElementById('faqBody');
                body.innerHTML = data.map(f => `<tr><td>${f.question}</td><td><button class="btn-del" onclick="deleteItem('faqs', ${f.id})">Sil</button></td></tr>`).join('');
            });
        }

        function toggleFeature(id, current) {
            fetch(`/api/articles/${id}/feature`, { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ is_featured: current ? 0 : 1 }) }).then(() => loadData());
        }

        document.getElementById('articleForm').onsubmit = (e) => {
            e.preventDefault();
            fetch('/api/articles', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({
                title: document.getElementById('aTitle').value,
                summary: document.getElementById('aSummary').value,
                content: document.getElementById('aContent').value,
                category: document.getElementById('articleCategory').value,
                image: document.getElementById('articleImage').value,
                is_featured: document.getElementById('aFeatured').checked ? 1 : 0
            }) }).then(res => {
                if (res.ok) {
                    document.getElementById('articleForm').reset();
                    loadData();
                    showToast('Makale başarıyla eklendi!');
                } else {
                    showToast('Makale eklenemedi.', 'error');
                }
            });
        };

        document.getElementById('faqForm').onsubmit = (e) => {
            e.preventDefault();
            fetch('/api/faqs', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({
                question: document.getElementById('fQuestion').value, 
                answer: document.getElementById('fAnswer').value
            }) }).then(res => {
                if (res.ok) {
                    document.getElementById('faqForm').reset();
                    loadFAQs();
                    showToast('SSS başarıyla eklendi!');
                } else {
                    showToast('SSS eklenemedi.', 'error');
                }
            });
        };

        loadData();
    </script>
</body>
</html>
